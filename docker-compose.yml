version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corporate_intelligence_platform
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - datasets_data:/app/uploads
      - database_data:/app/database
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/datasets"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  datasets_data:
  database_data:
